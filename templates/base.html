<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}보평고 비품관리 시스템{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block extra_css %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <a class="logo" href="{{ url_for('home') }}">
      보평고 비품관리 시스템 <span class="version">Model 1.1</span>
    </a>
    <nav class="site-nav">
      <a href="{{ url_for('home') }}">홈</a>
      <a href="{{ url_for('search') }}">비품 검색</a>
      <a href="{{ url_for('location') }}">위치</a>
      <a href="{{ url_for('reagents.import_csv') }}">시약 등록</a>
      <a href="{{ url_for('qr_public.scan') }}">스캔</a>
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  {% block extra_js %}{% endblock %}

  <footer class="site-footer">
    보평고 비품관리 시스템 Model 1.1 · 보일랩 비품 검색 프로토타입
  </footer>
</body>
</html>
