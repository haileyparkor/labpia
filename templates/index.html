{% extends "base.html" %}

{% block content %}
<section class="hero">
  <h1>보평고 비품관리 시스템</h1>
  <p>
    학생과 교사가 보일랩의 비품을 이름으로 검색하고, 어느 시약장에 얼마나
    남아 있는지 바로 확인할 수 있는 서비스입니다.
  </p>

  <!-- 검색어를 입력하면 비품 검색 페이지로 이동한다. -->
  <form class="search-form" action="{{ url_for('search') }}" method="get">
    <input
      type="text"
      name="keyword"
      placeholder="비품 이름, 분류, 설명으로 검색 (예: 비커)"
      aria-label="비품 검색어"
    >
    <button type="submit" class="button">검색</button>
  </form>

  <a class="button button-outline" href="{{ url_for('location', lab='보일랩') }}">
    보일랩 위치 보기
  </a>
</section>

<section class="info-grid">
  <article class="card">
    <h2>비품 검색</h2>
    <p>이름, 분류, 설명으로 찾고 위치와 잔량으로 걸러 볼 수 있습니다.</p>
    <a class="text-link" href="{{ url_for('search') }}">검색 페이지로 이동 →</a>
  </article>

  <article class="card">
    <h2>시약장 안내</h2>
    <p>보일랩의 1번부터 6번 시약장에 어떤 비품이 있는지 확인합니다.</p>
    <a class="text-link" href="{{ url_for('location') }}">위치 페이지로 이동 →</a>
  </article>
</section>
{% endblock %}
