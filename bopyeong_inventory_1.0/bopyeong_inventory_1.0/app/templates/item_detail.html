
{% extends "base.html" %}

{% block content %}
<article class="item-detail">
  <h1>{{ item.name }}</h1>
  <p class="category">{{ item.category }}</p>

  <dl>
    <dt>보관 위치</dt>
    <dd>{{ item.location_name }}</dd>

    <dt>시약장</dt>
    <dd>{{ item.cabinet_number }}번 시약장</dd>

    <dt>잔량</dt>
    <dd>
      <span class="badge badge-{{ item.remaining_level }}">
        {{ item.remaining_level }}
      </span>
    </dd>

    <dt>상태</dt>
    <dd>{{ item.status }}</dd>

    <dt>설명</dt>
    <dd>{{ item.description or "설명이 등록되지 않았습니다." }}</dd>
  </dl>

  <a class="button" href="{{ url_for('map_page', location_id=item.location_id) }}">
    위치 지도에서 보기
  </a>
</article>
{% endblock %}
